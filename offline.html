<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeZest — Offline</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, .14);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 18px;
      max-width: 460px;
    }
    .icon { font-size: 3.5rem; line-height: 1; margin-bottom: .75rem; }
    h1 { font-size: 1.5rem; margin-bottom: .6rem; }
    p { opacity: .92; line-height: 1.65; margin-bottom: 1.25rem; }
    button {
      border: 0;
      padding: .7rem 1.6rem;
      border-radius: 9px;
      background: #fff;
      color: #8b5cf6;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }
    button:hover { opacity: .9; }
    .hint { margin-top: 1.25rem; font-size: .8rem; opacity: .75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✈️</div>
    <h1>You're offline</h1>
    <p>
      CodeZest could not be loaded from the cache this time.
      Your saved files are still stored safely on this device
      and will be there when you reconnect.
    </p>
    <button onclick="location.replace('./')">Try again</button>
    <div class="hint">Once loaded, CodeZest works without an internet connection.</div>
  </div>
</body>
</html>
